<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- Zwei Ebenen statt drei. Vorher lag ein Salbeikreis auf dunklem Grund und
       der Haken darin — die eigentliche Marke nahm dadurch nur ein Drittel der
       Kachel ein und war bei 16 px etwa fünf Pixel groß. Jetzt trägt die ganze
       Kachel das Salbeigrün, und der Haken spannt über 60 % ihrer Breite.

       Farben aus der Palette (Designrichtung „Ruhiger Ratgeber"): Salbeigrün
       #3A5A44 als Grund, warmes Off-White #F6F7F4 als Marke — dasselbe
       Verhältnis von 7,16:1, das die Seite für Text verlangt. -->
  <rect width="64" height="64" rx="14" fill="#3A5A44" />
  <path d="M14 33 L26 45 L50 19" fill="none" stroke="#F6F7F4" stroke-width="8"
        stroke-linecap="round" stroke-linejoin="round" />
</svg>
